# Railway config for TEST environment frontend
# This is the staging/testing deployment configuration

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.frontend"

[build.buildArgs]
VITE_BACKEND_URL = "${{VITE_BACKEND_URL_TEST}}"
VITE_CLERK_PUBLISHABLE_KEY = "${{VITE_CLERK_PUBLISHABLE_KEY}}"

[deploy]
startCommand = "/docker-entrypoint.sh nginx -g 'daemon off;'"
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
