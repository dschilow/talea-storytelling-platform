<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#FFF7EC" />
    <meta name="description" content="Mit Talea wird dein Kind zur Hauptfigur: persönliche Geschichten, eigene Avatare und spannende Wissenswelten zum Lesen und Hören." />
    <title>Talea – KI-gestützte Geschichten für Kinder</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=logo-v2" />
    <link rel="icon" type="image/x-icon" sizes="any" href="/favicon.ico?v=logo-v2" />
    <link rel="shortcut icon" href="/favicon.ico?v=logo-v2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=logo-v5" />
    <link rel="preload" href="/fonts/fredoka-variable.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Apply the saved appearance before first paint, including offline starts.
      (() => {
        let preference = 'system';
        try {
          const saved = localStorage.getItem('talea_theme');
          if (['light', 'dark', 'system'].includes(saved)) preference = saved;
        } catch {}
        const dark = preference === 'dark' || (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.add(dark ? 'dark' : 'light');
        document.querySelector('meta[name="theme-color"]').content = dark ? '#211710' : '#FFF7EC';
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Font CSS must not block rendering or hide the page behind a CSS @import. -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"></noscript>
    <!-- Load runtime config before the app starts -->
    <script src="/config.js" defer></script>
    <style>
      /* Mobile optimizations while keeping scroll tracking */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
      }
      
      #root {
        width: 100%;
        min-height: 100vh;
        position: relative;
      }
      
      /* Hide mobile browser address bar on iOS */
      @supports (-webkit-touch-callout: none) {
        html, body {
          min-height: -webkit-fill-available;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
